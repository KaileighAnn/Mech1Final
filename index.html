
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dixie's Automatic Dog Feeder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <div class="hero-grid">
      <div class="hero-copy">
        <h1>Dixie's <em>Dog Feeder</em></h1>
        <p class="hero-intro">
          An Arduino-controlled automatic dog feeder
          designed for my Mechatronics I final project.
        </p>
        <p class="student-name">Designed by Kaileigh Hill</p>
      </div>
      <div class="hero-visual">
        <div class="feeder">
          <div class="feeder-top"></div>
          <div class="feeder-body">
            <div class="kibble">DOG FOOD</div>
          </div>
          <div class="feeder-chute"></div>
          <div class="feeder-bowl">DIXIE MAE</div>
          <div class="servo">SERVO</div>
        </div>
      </div>
    </div>
  </section>

</html>
